<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Nexora-Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-body">

  <main class="auth-wrap">
    <div class="auth-card">

      <a href="index.html" class="auth-brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="28" height="20" rx="4" fill="url(#ag1)"/>
            <path d="M4 9l12 9 12-9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="ag1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          </svg>
        </span>
        <span class="brand__name">Nexora<span class="brand__accent">Mail</span></span>
      </a>

      <h1 class="auth-title">Connexion à votre messagerie</h1>
      <p class="auth-subtitle">Accédez à votre boîte de réception Nexora-Mail</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="prenom.nom@nexora-mail-7fdk.onrender.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="loginBtn">Se connecter</button>
        <p class="form-status" id="loginStatus" aria-live="polite"></p>
      </form>

      <p class="auth-back"><a href="index.html">← Retour au site</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
