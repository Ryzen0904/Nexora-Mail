<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer mon e-mail — Nexora-Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-body">

  <main class="auth-wrap auth-wrap--wide">
    <div class="auth-card">

      <a href="index.html" class="auth-brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="28" height="20" rx="4" fill="url(#sg1)"/>
            <path d="M4 9l12 9 12-9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="sg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          </svg>
        </span>
        <span class="brand__name">Nexora<span class="brand__accent">Mail</span></span>
      </a>

      <h1 class="auth-title">Créez votre adresse professionnelle</h1>
      <p class="auth-subtitle" id="planLabel">Plan choisi : <strong>—</strong></p>

      <div class="email-preview" id="emailPreview" aria-live="polite">
        <span class="email-preview__label">Votre adresse</span>
        <p class="email-preview__addr">prenom.nom@nexora-mail.com</p>
      </div>

      <form id="signupForm" class="auth-form" novalidate>
        <div class="form-row signup-row">
          <div class="form-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" name="firstname" placeholder="Jean" autocomplete="given-name" required>
          </div>
          <div class="form-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="lastname" placeholder="Dupont" autocomplete="family-name" required>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="6 caractères minimum" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="signupBtn">Créer mon e-mail</button>
        <p class="form-status" id="signupStatus" aria-live="polite"></p>
      </form>

      <div class="signup-success" id="signupSuccess" hidden>
        <p class="signup-success__emoji">🎉</p>
        <h2>Félicitations !</h2>
        <p>Votre adresse <strong id="successEmail">…</strong> est créée.<br>Connectez-vous dès maintenant :</p>
        <a href="login.html" class="btn btn--primary btn--full">Me connecter</a>
      </div>

      <p class="auth-back"><a href="index.html">← Retour au site</a></p>
    </div>
  </main>

  <script src="js/signup.js"></script>
</body>
</html>
